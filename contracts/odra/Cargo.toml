[package]
name = "skywee_contracts"
version = "0.1.0"
edition = "2021"
description = "SKYWEE — Agentic Web3 OS smart contracts for Casper Network"
authors = ["SKYWEE Team"]

[dependencies]
odra = "2.8.2"
odra-casper-wasm-env = "2.8.2"
odra-casper-livenet-env = { version = "2.8.2", optional = true }

[dev-dependencies]
odra = { version = "2.8.2", features = ["disable-allocator"] }

[features]
livenet = ["odra-casper-livenet-env"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "skywee_contracts_build_contract"
path = "bin/build_contract.rs"

[[bin]]
name = "deploy_skywee"
path = "bin/deploy.rs"
required-features = ["livenet"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
